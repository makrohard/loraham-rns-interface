name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One group per ref; a newer push to a branch cancels its older run, never on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is Raspberry Pi OS Trixie's interpreter, 3.11 Bookworm's (the pyproject floor).
        python-version: ["3.11", "3.13"]
        # the newest RNS, and the floor in pyproject.toml (the version LoRaHAM Pi Control pins)
        rns: ["latest", "1.5.5"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0              # the house-rules check reads the pushed range

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and its test tools
        env:
          RNS: ${{ matrix.rns }}
        run: |
          python -m pip install --upgrade pip
          if [ "$RNS" = latest ]; then pip install .[dev]; else pip install .[dev] "rns==$RNS"; fi
          python -c "import RNS; print('rns', RNS.__version__)"

      - name: Ruff (package, plugin and scripts, frozen rule set)
        run: ruff check loraham_rns interfaces plugins scripts

      - name: Ruff (tests, fatal errors only)
        run: ruff check tests --select F,E9

      - name: Tests
        run: python -m pytest -q -rs

      - name: House rules (a HARD line fails; WARN lines are the reviewer's)
        # LoRaHAM Pi Control's checker at a fixed commit, over the pushed range, with this repository's
        # .houserules.toml. git only, not the interpreter or RNS: one matrix leg is enough.
        if: matrix.python-version == '3.13' && matrix.rns == 'latest'
        env:
          LHPC_REPO: https://github.com/makrohard/loraham-pi-control
          LHPC_COMMIT: d8e330ccc92c2c54761ab93ec7e9d16ff67a35b9
          # the rules hold from this commit on (this repository's first profile); the history before it
          # fails them and is not rewritten
          HR_FLOOR: 093ee0134db111ca87db71eeb20263c91d3a11d1
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git clone -q --filter=blob:none "$LHPC_REPO" "$RUNNER_TEMP/lhpc"
          git -C "$RUNNER_TEMP/lhpc" checkout -q --detach "$LHPC_COMMIT"
          range=$(bash "$RUNNER_TEMP/lhpc/tools/houserules_ci_range.sh" "$HR_FLOOR" "$EVENT" "$BEFORE" "$GITHUB_SHA" "$PR_BASE")
          echo "house rules range: ${range:-none}"
          if [ -n "$range" ]; then python "$RUNNER_TEMP/lhpc/tools/check_houserules.py" "$range"; fi
